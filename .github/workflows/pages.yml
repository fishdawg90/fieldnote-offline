name: Build and publish offline notebook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          # The shipped app uses onnxruntime-web WASM, not Node CUDA binaries.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm test
      - run: npm run build
      - name: Check shipped JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/asset-data.js
          node --check dist/gis-worker.js
          node --check dist/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
